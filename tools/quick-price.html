    .suggestion:hover, .suggestion:focus { background:rgba(31,122,82,.1); outline:none; }

    /* iPhone-style refinement aligned with the quote module. */

      const entries = [];

          });

          entries.push({ type:'concrete', title:warehouse + info.title, aliases:[warehouse, warehouse + '清水', info.title, ...info.aliases], warehouse, category:'混凝土', note, rows });
        });

    function concreteTableEntries() {
      const labels = { flat:'清水平板', cave:'清水虫洞板', texture:'木纹板 / 竹纹板' };

    function cementBoardEntries() {
      const brandOrder = { '福建': 10, '贝厂': 20 };

    function meililaiEntries() {
      return productData.groupedMeililaiCatalog().map((item) => ({

        rows:item.variants.map((variant) => ({
          label:'规格 ' + specLabel(variant.spec) + (variant.condition ? ' · ' + variant.condition : ''),
          subLabel:[variant.thickness ? '厚度 ' + variant.thickness : '', variant.weight ? '重量 ' + variant.weight : '', variant.note || ''].filter(Boolean).join(' · '),

    function meililaiTableEntries() {
      const rows = [];
      meililaiRows.forEach((item) => {
        rows.push({
          label:item.name + ' · 规格 ' + specLabel(item.spec) + (item.condition ? ' · ' + item.condition : ''),
          subLabel:[item.thickness ? '厚度 ' + item.thickness : '', item.weight ? '重量 ' + item.weight : '', item.note || ''].filter(Boolean).join(' · '),
          price:item.price
        });
      });
      return [{
        type:'meililai-table',
        title:'美利来价格表',
        aliases:['MLL', 'MLL柔岩板', 'MLL价格表', '美利来', '美丽来', '美利来价格表', '美丽来价格表'],
        warehouse:'美利来',
        category:'柔岩板',
        unit:'平方单价 / 元每平',
        note:'价格统一读取《美利来价格明细表2026.4.13》；打印另加10元/㎡。搜索具体产品可查看规格、底价和备注。',
        rows
      }];
    }
    const priceEntries = [...liujinTableEntries(), ...liujinEntries(), ...sandstoneEntries(), ...ningboTableEntries(), ...ningboEntries(), ...concreteTableEntries(), ...concreteEntries(), ...cementBoardEntries(), ...meiyanEntries(), ...translucentBoardEntries(), ...translucentBenchEntries(), ...rammedEarthEntries(), ...meteoriteBoardEntries(), ...meililaiTableEntries(), ...meililaiEntries()];
    function scoreEntry(entry, query) { const q = normalize(query); if (!q) return 0; const hay = [entry.title, entry.warehouse, entry.category, ...entry.aliases].map(normalize); let score = 0; hay.forEach((text) => { if (!text) return; if (text === q) score = Math.max(score,100); else if (text.startsWith(q)) score = Math.max(score,80); else if (text.includes(q)) score = Math.max(score,60 - Math.min(text.indexOf(q),20)); else if (q.includes(text) && text.length >= 2) score = Math.max(score,45 + Math.min(text.length,20)); }); return score; }
    function matchingEntries(query) {
      const scored = priceEntries.map((entry) => ({ entry, score:scoreEntry(entry, query) })).filter((item) => item.score > 0);
      const q = normalize(query);
      const exactTable = scored.filter((item) => ['meililai-table', 'liujin-table', 'concrete-table', 'ningbo-table'].includes(item.entry.type) && [item.entry.title, ...item.entry.aliases].map(normalize).includes(q));
      if (exactTable.length && (q.includes('价格表') || ['鎏金板', 'nb柔岩板', '混凝土', 'mll', 'mll柔岩板', '美利来', '美丽来'].includes(q))) return exactTable.map((item) => item.entry);
      if (q === normalize('洞石')) {
        const exactNingboDongshi = scored.filter((item) => item.entry.type === 'ningbo' && normalize(item.entry.title) === q);
        const meililaiDongshi = scored.filter((item) => item.entry.type === 'meililai' && [item.entry.title, ...item.entry.aliases].map(normalize).some((text) => text.includes(q)));
        const combined = [...exactNingboDongshi, ...meililaiDongshi];
        if (combined.length) return combined.sort((a,b) => {
          const typeOrder = { ningbo:10, meililai:20 };
          return (typeOrder[a.entry.type] || 100) - (typeOrder[b.entry.type] || 100) || b.score - a.score || a.entry.title.localeCompare(b.entry.title, 'zh-Hans-CN');
        }).map((item) => item.entry);
      }
      const sameNameNingboAndMeililai = scored.filter((item) => ['ningbo', 'meililai'].includes(item.entry.type) && [item.entry.title, ...item.entry.aliases].map(normalize).includes(q));
      if (sameNameNingboAndMeililai.some((item) => item.entry.type === 'ningbo') && sameNameNingboAndMeililai.some((item) => item.entry.type === 'meililai')) {
        const typeOrder = { ningbo:10, meililai:20 };
        return sameNameNingboAndMeililai.sort((a,b) => (typeOrder[a.entry.type] || 100) - (typeOrder[b.entry.type] || 100) || a.entry.title.localeCompare(b.entry.title, 'zh-Hans-CN')).map((item) => item.entry);
      }
      const exactMeililai = scored.filter((item) => item.entry.type === 'meililai' && [item.entry.title, ...item.entry.aliases].map(normalize).includes(q));
      if (exactMeililai.length) return exactMeililai.sort((a,b) => a.entry.title.localeCompare(b.entry.title, 'zh-Hans-CN')).map((item) => item.entry);
      const exactNingbo = scored.filter((item) => item.entry.type === 'ningbo' && [item.entry.title, ...item.entry.aliases].map(normalize).includes(q));
      if (exactNingbo.length) return exactNingbo.sort((a,b) => a.entry.title.localeCompare(b.entry.title, 'zh-Hans-CN')).map((item) => item.entry);
      const exactLiujin = scored.filter((item) => item.entry.type === 'liujin' && [item.entry.title, ...item.entry.aliases].map(normalize).includes(q));
      if (exactLiujin.length) return exactLiujin.sort((a,b) => (a.entry.sortOrder || 100) - (b.entry.sortOrder || 100) || a.entry.title.localeCompare(b.entry.title, 'zh-Hans-CN')).map((item) => item.entry);
      const maxScore = scored.reduce((max, item) => Math.max(max, item.score), 0);
      const filtered = maxScore >= 80 ? scored.filter((item) => item.score >= 60) : scored;
      const focused = q.includes('夯土') && !q.includes('3d') && filtered.some((item) => item.entry.type === 'rammed-earth') ? filtered.filter((item) => item.entry.type === 'rammed-earth') : filtered;
      return focused.sort((a,b) => b.score - a.score || (a.entry.sortOrder || 100) - (b.entry.sortOrder || 100) || a.entry.title.localeCompare(b.entry.title, 'zh-Hans-CN')).map((item) => item.entry);
    }
    function renderSuggestions(query) { const matches = matchingEntries(query).slice(0,12); els.suggestions.classList.toggle('show', Boolean(query.trim()) && matches.length > 0); els.suggestions.innerHTML = matches.map((entry,index) => '<button class="suggestion" type="button" data-index="' + index + '"><strong>' + esc(entry.title) + '</strong><span>' + esc(entry.warehouse) + ' · ' + esc(entry.category) + (entry.aliases.length ? ' · ' + esc(entry.aliases.join(' / ')) : '') + '</span></button>').join(''); els.suggestions.querySelectorAll('.suggestion').forEach((button) => { button.addEventListener('click', () => { const entry = matches[Number(button.dataset.index)]; els.query.value = entry.aliases[0] || entry.title; els.suggestions.classList.remove('show'); renderResults([entry]); }); }); }
    function renderRowPrices(row) {
      if (row.price === '' || row.price === null || row.price === undefined) return '';
      const minimumPrice = row.minimumPrice === '' || row.minimumPrice === null || row.minimumPrice === undefined ? '' : '<b class="minimum-price"><small>最低售价</small>' + esc(money(row.minimumPrice)) + '</b>';
      return '<span class="price-values"><b><small>底价</small>' + esc(money(row.price)) + '</b>' + minimumPrice + '</span>';
    }
    function renderResults(entries) { if (!entries.length) { els.results.innerHTML = '<div class="panel empty">没有匹配到价格。换一个关键词试试，例如“陨石板”“夯土板”“透光板”“坐凳”。</div>'; return; } els.results.innerHTML = entries.map((entry) => '<article class="card"><div class="card-head"><div class="card-title"><strong>' + esc(entry.title) + '</strong><span class="meta">' + esc(entry.warehouse) + ' · ' + esc(entry.category) + (entry.aliases.length ? ' · 关键词：' + esc(entry.aliases.join('、')) : '') + '</span></div><span class="badge">' + esc(entry.unit || '底价 / 元每平') + '</span></div><div class="price-grid' + (entry.layout === 'single' ? ' single' : '') + '">' + entry.rows.map((row) => '<div class="price-row"><span><strong class="row-main">' + esc(row.label) + '</strong>' + (row.subLabel ? '<small class="row-sub">' + (row.tag ? '<mark class="row-tag ' + esc(row.tagClass || '') + '">' + esc(row.tag) + '</mark>' : '') + esc(row.subLabel) + '</small>' : '') + (row.priceItems ? '<span class="sub-price-list">' + row.priceItems.map((item) => '<span class="sub-price">' + esc(item.label) + '<strong>底价</strong><b>' + esc(money(item.price)) + '</b></span>').join('') + '</span>' : '') + '</span>' + renderRowPrices(row) + '</div>').join('') + '</div>' + (entry.note ? '<p class="note">' + esc(entry.note) + '</p>' : '') + '</article>').join(''); }
    function searchNow() { const q = els.query.value.trim(); renderSuggestions(q); if (!q) { els.results.innerHTML = '<div class="panel empty">输入关键词后显示价格。鎏金板同时显示底价与最低售价，其他产品保持原有价格展示。</div>'; return; } renderResults(matchingEntries(q).slice(0,20)); }
    els.query.addEventListener('input', searchNow); els.query.addEventListener('focus', () => renderSuggestions(els.query.value)); els.clearSearchBtn.addEventListener('click', () => { els.query.value = ''; els.suggestions.classList.remove('show'); searchNow(); els.query.focus(); }); document.addEventListener('click', (event) => { if (!event.target.closest('.search-wrap')) els.suggestions.classList.remove('show'); });
    function loadQuickWords() {
      try {
        const saved = JSON.parse(localStorage.getItem('quickPriceTags') || '[]');
        if (!Array.isArray(saved)) return quickWordsDefault;
        return [...saved.filter((word) => quickWordsDefault.includes(word)), ...quickWordsDefault.filter((word) => !saved.includes(word))];
      } catch (error) {
        return quickWordsDefault;
      }
    }
    let quickWords = loadQuickWords();
    function saveQuickWords() { localStorage.setItem('quickPriceTags', JSON.stringify(quickWords)); }
    function renderQuickTags() {
      els.quickTags.innerHTML = quickWords.map((word, index) => '<button class="tag-btn" type="button" draggable="true" data-index="' + index + '">' + esc(word) + '</button>').join('');
      els.quickTags.querySelectorAll('.tag-btn').forEach((button) => {
        let didDrag = false;
        button.addEventListener('click', () => {
          if (didDrag) { didDrag = false; return; }
          els.query.value = button.textContent;
          els.suggestions.classList.remove('show');
          searchNow();
          els.query.focus();
        });
        button.addEventListener('dragstart', (event) => {
          didDrag = true;
          button.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', button.dataset.index);
        });
        button.addEventListener('dragend', () => button.classList.remove('dragging'));
        button.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
        });
        button.addEventListener('drop', (event) => {
          event.preventDefault();
          const from = Number(event.dataTransfer.getData('text/plain'));
          const to = Number(button.dataset.index);
          if (!Number.isInteger(from) || !Number.isInteger(to) || from === to) return;
          const [word] = quickWords.splice(from, 1);
          quickWords.splice(to, 0, word);
          saveQuickWords();
          renderQuickTags();
        });
      });
    }
    renderQuickTags();
    els.query.focus();
